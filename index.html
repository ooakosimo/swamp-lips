<style>

html,body{margin:0;height:100%;overflow:hidden;background:#12201a;font-family:Verdana,Geneva,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

#brand b{display:block;font-size:15px;letter-spacing:2px}
#brand span{font-size:11px;opacity:.85}
#hint{margin-top:4px}
body.touch #hint{display:none}
#topbtns{position:fixed;right:12px;top:10px;z-index:10;display:flex;gap:8px}

.btn.on{background:var(--accent);outline:3px solid #fff}
.dance{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:86px;min-height:44px;justify-content:center}
.dance b{font-size:17px;line-height:1}
.dance span{font-size:11px}
@media (max-width:640px){#dock{display:grid;grid-template-columns:repeat(4,1fr);width:96vw}.dance{min-width:0}#nameTag{font-size:18px}}
</style>

  for (const s of rig.stalks) {   // pupils watch the camera
    _tw.copy(camera.position); s.eg.worldToLocal(_tw); _tw.normalize().multiplyScalar(0.06); s.pu.position.copy(_tw);
  }
  // arms
  _inv.copy(model.matrixWorld).invert();
  const yc = Math.cos(yaw), ys = Math.sin(yaw);
  const toW = (x, y, z, out) => out.set(P.px + x * yc + z * ys, y, P.pz - x * ys + z * yc);
  for (let i = 0; i < 2; i++) {
    const arm = arms[i], A = P.a[i], sd = arm.side, S = arm.sh1;
    arm.sh0.copy(S); model.localToWorld(S.set(sd * SHOULDER.x, SHOULDER.y, 0));
    // guides: where each joint would like to be (the arm lags behind these with a spring)
    const H = toW(sd * A.hx, A.hy, A.hz, _tw), E = toW(sd * A.ex, A.ey, A.ez, _tw2);
    const cx = 2 * E.x - 0.5 * (S.x + H.x), cy = 2 * E.y - 0.5 * (S.y + H.y), cz = 2 * E.z - 0.5 * (S.z + H.z);
    const old = arm.guideOld; arm.guideOld = arm.guide; arm.guide = old;
    for (let j = 1; j <= NSEG; j++) {
      const u = j / NSEG, iu = 1 - u, g = arm.guide[j];
      g.set(iu * iu * S.x + 2 * iu * u * cx + u * u * H.x, iu * iu * S.y + 2 * iu * u * cy + u * u * H.y, iu * iu * S.z + 2 * iu * u * cz + u * u * H.z);
      if (A.wrap > 0) {
        const wb = sstep(0, 0.35, A.wrap), phi = sd * PI / 2 + A.wdir * A.wth * A.wrap * u;
        toW(A.wrx * Math.sin(phi), A.wy0 + (A.wy1 - A.wy0) * u, A.wrz * Math.cos(phi), _hp); g.lerp(_hp, wb);
      }
      if (A.wa) { const env2 = 0.25 + 0.75 * u, ph = A.wph - A.wk * (1 - u), oy = A.wa * env2 * Math.sin(ph), oz = A.wa * 0.6 * env2 * Math.cos(ph); g.y += oy; g.x += oz * ys; g.z += oz * yc; }
    }
    let path = S.distanceTo(arm.guide[1]); for (let j = 1; j < NSEG; j++) path += arm.guide[j].distanceTo(arm.guide[j + 1]);   // wrapped arms need their whole path, not just the reach
    const need = path / (NSEG * L0) * 1.02;
    const sT = Math.min(A.smax, Math.max(A.st, need, 1));
    arm.step(A.pull, A.grav, sT, _inv, model.matrixWorld);
    arm.build();
    // slap detection: fist came down fast onto the mud
    const hy = arm.p[NSEG].y; arm.cool -= h;
    if (arm.cool <= 0 && arm.prevY - hy > 0.22 && hy < 0.18) { const f = clamp((arm.prevY - hy) / 0.9, 0.2, 1); splat(arm.p[NSEG].x, arm.p[NSEG].z, f, false); arm.cool = 0.2; for (const s of rig.stalks) s.v += 5 * f * (rnd() < 0.5 ? 1 : -1.3); }
    arm.prevY = hy;
  }
  labelTarget.set(P.px, 1.72 + Math.max(0, P.py) * 0.95, P.pz);
}
function tick() {
  poseT += POSE_DT; poseK++;
  const P = computePose();
  rigApply(P, POSE_DT);
  updateStage(); updateFx(POSE_DT);
}

// ================================================================ 11. UI + INPUT
const dock = $('dock');
DANCES.forEach((d, n) => { if (!d) return; const b = document.createElement('button'); b.className = 'btn dance'; b.dataset.n = n; b.innerHTML = '<b>' + n + '</b><span>' + d.name + '</span>'; b.addEventListener('click', () => setDance(n)); dock.appendChild(b); });
{ const b = document.createElement('button'); b.className = 'btn dance'; b.innerHTML = '<b>0</b><span>Rest</span>'; b.addEventListener('click', () => setDance(0)); dock.appendChild(b); }
const btnSky = $('btnSky'), btnTurn = $('btnTurn'), tag = $('nameTag');
function setName(s) { look.name = s; tag.textContent = s; }
function setMode(i, snap) {
  modeIdx = (i + MODES.length) % MODES.length; modeTarget(MODES[modeIdx], envT);
  if (snap) { copyEnv(env, envT); }
  btnSky.textContent = 'Sky: ' + MODES[modeIdx].name + ' (S)';
  const r = document.documentElement.style, p = PC[MODES[modeIdx].pal];
  r.setProperty('--paper', PALETTES[MODES[modeIdx].pal].paper[0]); r.setProperty('--paper2', PALETTES[MODES[modeIdx].pal].paper[1]); r.setProperty('--accent', PALETTES[MODES[modeIdx].pal].accent);
  r.setProperty('--ink', modeIdx === 2 ? '#241a3a' : modeIdx === 1 ? '#3a2330' : '#17302a');
}
function setTurn(on) { turn.on = on; btnTurn.textContent = 'Turntable: ' + (on ? 'on' : 'off') + ' (T)'; btnTurn.classList.toggle('on', on); }
btnSky.addEventListener('click', () => setMode(modeIdx + 1));
btnTurn.addEventListener('click', () => setTurn(!turn.on));
window.addEventListener('keydown', (e) => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '6') setDance(+k); else if (k === '0' || k === ' ' || k === 'escape') { setDance(0); e.preventDefault(); }
  else if (k === 's') setMode(modeIdx + 1); else if (k === 't') setTurn(!turn.on);
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

const _lp = new THREE.Vector3(), labelPos = new THREE.Vector3(0, 1.7, 0);
function updateLabel(dt) {
  labelPos.lerp(labelTarget, 1 - Math.exp(-dt * 14));
  _lp.copy(labelPos).project(camera);
  if (_lp.z > 1) { tag.style.visibility = 'hidden'; return; }
  tag.style.visibility = 'visible';
  tag.style.transform = 'translate(' + Math.round((_lp.x * 0.5 + 0.5) * window.innerWidth) + 'px,' + Math.round((-_lp.y * 0.5 + 0.5) * window.innerHeight) + 'px) translate(-50%,-100%)';
}

// ================================================================ 12. MAIN LOOP
let skyKey = '';
const WHITE = new THREE.Color(0xffffff);
function applyEnv() {
  scene.fog.color.copy(env.fog); scene.fog.density = env.fogD;
  hemi.color.copy(env.hemiSky); hemi.groundColor.copy(env.hemiGnd); hemi.intensity = env.hemi;
  sunLight.color.copy(env.sunCol); sunLight.intensity = env.sun;
  sunLight.position.copy(env.dir).multiplyScalar(22); sunLight.target.position.set(0, 0, 0);
  glowLight.color.copy(env.accent); glowLight.intensity = (env.flies * 14);
  sunSprite.position.copy(env.dir).multiplyScalar(85); sunSprite.material.color.copy(env.sunCol).lerp(WHITE, 0.35); sunSprite.material.opacity = clamp(0.5 + env.dir.y, 0.3, 1);
  waterMat.color.copy(env.water);
  for (let i = 0; i < 3; i++) { cloudMats[i].color.copy(env.paper[i]); cloudMats[i].color.multiplyScalar(lerp(1, 0.38, clamp(env.stars, 0, 1))); }
  stars.material.opacity = env.stars; flies.m.material.opacity = env.flies * 0.9;
  waterRings.forEach((m) => m.material.color.copy(env.paper[0]));
  const key = env.top.getHexString() + env.bot.getHexString() + env.fog.getHexString();
  if (key !== skyKey) { skyKey = key; drawSky(); }
}
let acc = 0, prevT = performance.now() / 1000;
function frame() {
  const now = performance.now() / 1000, dt = Math.min(0.1, now - prevT); prevT = now;
  acc += dt; let n = 0;
  while (acc >= POSE_DT && n < 4) { acc -= POSE_DT; tick(); n++; }
  if (acc > POSE_DT) acc = 0;
  stepEnv(dt); applyEnv();
  clouds.rotation.y += dt * 0.004;
  controls.autoRotate = turn.on && !turn.held && (now - turn.last) > 2.5;
  controls.update(dt);
  updateLabel(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// start: optional deep links for recording, e.g. index.html?dance=5&sky=night&turn=0
{
  const q = new URLSearchParams(location.search);
  setMode(1, true);
  const sky = q.get('sky'); if (sky !== null) { const i = isNaN(+sky) ? MODES.findIndex(m => m.name.toLowerCase() === sky.toLowerCase()) : +sky; if (i >= 0) setMode(i, true); }
  if (q.get('turn') === '0') setTurn(false); else setTurn(true);
  for (let i = 0; i < 70; i++) tick();   // let the arms settle onto the mud before the first frame
  const d = +q.get('dance'); if (d >= 1 && d <= 6) setDance(d);
  setName(look.name);
  if (q.get('cam')) { const c = q.get('cam').split(',').map(Number); if (c.length === 3) camera.position.set(c[0], c[1], c[2]); }
  labelPos.copy(labelTarget);
}
window.__swamp = { setDance, setMode, tick, rig, arms, get poseT() { return poseT; } };
requestAnimationFrame(frame);
